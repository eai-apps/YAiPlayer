<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0f19" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
  </g>

  <!-- Main Card -->
  <g transform="translate(140, 95)">
    <!-- Logo Badge -->
    <rect x="0" y="30" width="130" height="130" rx="34" fill="url(#logoGrad)" filter="url(#cardShadow)" />
    <!-- Play Triangle in Logo -->
    <path d="M 52 75 C 52 71.5, 56 69.5, 59 71.2 L 92 90 C 95 91.7, 95 96.3, 92 98 L 59 116.8 C 56 118.5, 52 116.5, 52 113 Z" fill="#ffffff" />

    <!-- Typography -->
    <text x="170" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">YAiPlayer</text>
    <text x="170" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#60a5fa">Smart IPTV Player for Android TV &amp; Mobile</text>

    <!-- Subtitle description -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">Умный IPTV-плеер для телевизора и смартфона</text>
    <text x="0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Прямой эфир • Архив передач • Детальный EPG • Медиатека VOD</text>

    <!-- Trust Pills Row -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="230" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#10b981">✓ 100% Бесплатно</text>

      <rect x="250" y="0" width="180" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="274" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">🚫 0% Рекламы</text>

      <rect x="450" y="0" width="220" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="474" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#93c5fd">🛡️ Без трекеров</text>

      <rect x="690" y="0" width="230" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="714" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c084fc">📜 Open Source GPL-3</text>
    </g>
  </g>
</svg>
