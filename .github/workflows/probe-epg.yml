name: Probe EPG feeds
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://iptvx.one/EPG http://ru.epg.one/epg.xml.gz http://miptv.in.ua/xmlt/mlist_epg.xml.gz; do
            for ua in "okhttp/4.12.0" "Mozilla/5.0"; do
              echo "=== $u  UA=$ua"
              rm -f feed.bin hdr.txt
              curl -sSL -m 120 -A "$ua" -D hdr.txt -o feed.bin "$u" || echo "curl failed $?"
              grep -iE "^HTTP|content-type|content-encoding|content-length|location" hdr.txt | tr -d '\r'
              ls -l feed.bin 2>/dev/null | awk '{print "bytes",$5}'
              file feed.bin 2>/dev/null
              if file feed.bin | grep -qi gzip; then zcat feed.bin > feed.xml 2>/dev/null; else cp feed.bin feed.xml; fi
              echo "channels: $(grep -o '<channel ' feed.xml | wc -l)  programmes: $(grep -o '<programme ' feed.xml | wc -l)  icons: $(grep -o '<icon ' feed.xml | wc -l)"
              head -c 300 feed.xml | tr '\n' ' '; echo
              grep -o '<channel id="[^"]*"' feed.xml | head -3
            done
          done
