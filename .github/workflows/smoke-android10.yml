name: Android 10 smoke (release build)

# Builds the same minified release as Release (x86_64 flavor, debug-free) and runs it on an API 29 emulator.
# Called by release.yml before anything is published; can be started by hand on any branch.
on:
  workflow_call:
  workflow_dispatch:
  # Also on test branches, so a build that would crash on Android 10 is seen before it is merged.
  push:
    branches: ['test/**']
    paths:
      - 'clients/android-tv/**'
      - 'clients/android-mobile/**'
      - 'clients/owntv-core/**'
      - 'tools/ci/**'
      - '.github/workflows/smoke-android10.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: android-tv
            pkg: com.yai.iptv.player.tv
          - app: android-mobile
            pkg: com.yai.iptv.player.mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yaiplayer-release.jks"
          test -s "$RUNNER_TEMP/yaiplayer-release.jks"
      - name: Build release (x86_64, same R8 rules)
        working-directory: clients/${{ matrix.app }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/yaiplayer-release.jks"
          chmod +x gradlew
          ./gradlew :app:assembleX86_64Release -Powntv.corePath=${GITHUB_WORKSPACE}/clients/owntv-core --no-daemon --stacktrace
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" "$GITHUB_WORKSPACE/smoke.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/ci/smoke_android10.sh smoke.apk ${{ matrix.pkg }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.app }}
          path: '*.log'
