name: Build
# Облачная сборка YAiPlayer. Запускается при каждом push в main или вручную:
# GitHub → Actions → Build → Run workflow.
# Готовые APK: на странице запуска, раздел Artifacts (внизу).
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [android-tv, android-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Сборка (debug, ARM)
        working-directory: clients/${{ matrix.app }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardFullDebug :app:assembleStandardPlayDebug -Powntv.corePath=${GITHUB_WORKSPACE}/clients/owntv-core --no-daemon --stacktrace
      - name: Проверка Play-сборки (без радио и без самообновления)
        run: |
          apk=$(ls clients/${{ matrix.app }}/app/build/outputs/apk/standardPlay/debug/*.apk | head -n1)
          full=$(ls clients/${{ matrix.app }}/app/build/outputs/apk/standardFull/debug/*.apk | head -n1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          rm -rf /tmp/p /tmp/f && mkdir -p /tmp/p /tmp/f
          unzip -q -o "$apk" 'classes*.dex' -d /tmp/p
          unzip -q -o "$full" 'classes*.dex' -d /tmp/f
          # Контроль: в полной сборке радио есть (иначе проверка ниже ничего не значит).
          grep -q -a 'Ltv/own/owntv/radio/RadioRepository;' /tmp/f/classes*.dex || { echo "FULL: радио не найдено"; exit 1; }
          if grep -l -a -e 'Ltv/own/owntv/radio/' -e 'RadioScreenKt;' /tmp/p/classes*.dex; then echo "PLAY: найден код радио"; exit 1; fi
          if "$bt/aapt2" dump permissions "$apk" | grep -q REQUEST_INSTALL_PACKAGES; then echo "PLAY: есть REQUEST_INSTALL_PACKAGES"; exit 1; fi
          "$bt/aapt2" dump permissions "$full" | grep -q REQUEST_INSTALL_PACKAGES || { echo "FULL: нет REQUEST_INSTALL_PACKAGES"; exit 1; }
          if "$bt/aapt2" dump strings "$apk" | grep -q -i 'radio_title'; then echo "PLAY: строки радио"; exit 1; fi
          echo "Play-сборка чистая: радио нет, самообновления нет"
      - name: Собрать APK в одно место
        run: |
          mkdir -p out
          find clients/${{ matrix.app }}/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: YAiPlayer-${{ matrix.app }}-debug
          path: out/*.apk
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      - run: npm run build
        working-directory: clients/web
