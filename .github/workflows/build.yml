name: Build
# Облачная сборка YAiPlayer. Запускается при каждом push в main или вручную:
# GitHub → Actions → Build → Run workflow.
# Готовые APK: на странице запуска, раздел Artifacts (внизу).
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [android-tv, android-mobile]
    steps:
      - uses: actions/checkout@v4
      # The TV launcher (clients/tv-launcher, from Gathin23/cleanyourtv) keeps its own Gradle 8.9, which needs JDK 17.
      - uses: actions/setup-java@v4
        id: jdk17
        if: matrix.app == 'android-mobile'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Лаунчер для ТВ («Ускорь телевизор» ставит его на приставку)
        if: matrix.app == 'android-mobile'
        working-directory: clients/tv-launcher
        env:
          JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../android-mobile/app/src/main/assets/tvoptimizer
          cp app/build/outputs/apk/release/app-release.apk ../android-mobile/app/src/main/assets/tvoptimizer/launcher.apk
          ls -la ../android-mobile/app/src/main/assets/tvoptimizer
      - name: Сборка (debug, ARM)
        working-directory: clients/${{ matrix.app }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug -Powntv.corePath=${GITHUB_WORKSPACE}/clients/owntv-core --no-daemon --stacktrace
      - name: Собрать APK в одно место
        run: |
          mkdir -p out
          find clients/${{ matrix.app }}/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: YAiPlayer-${{ matrix.app }}-debug
          path: out/*.apk
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      - run: npm run build
        working-directory: clients/web
