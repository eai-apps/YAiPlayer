name: Release (signed APK)

on:
  push:
    branches: [main]
    paths:
      - 'clients/android-tv/**'
      - 'clients/android-mobile/**'
      - 'clients/owntv-core/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: android-tv
            name: TV
          - app: android-mobile
            name: Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yaiplayer-release.jks"
          test -s "$RUNNER_TEMP/yaiplayer-release.jks"
      - name: Build signed release
        working-directory: clients/${{ matrix.app }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/yaiplayer-release.jks"
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease -Powntv.corePath=${GITHUB_WORKSPACE}/clients/owntv-core --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(ls clients/${{ matrix.app }}/app/build/outputs/apk/standard/release/*.apk | head -n1)
          cp "$apk" out/YAiPlayer-${{ matrix.name }}.apk
          ls -l out
      - name: Verify signature
        run: |
          bt=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          "$bt/apksigner" verify --print-certs out/YAiPlayer-${{ matrix.name }}.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: YAiPlayer-${{ matrix.name }}
          path: out/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        run: |
          # docs/WHATS_NEW.md holds the user-facing changes for THIS release (Russian bullets).
          notes="$(grep -v '^<!--' docs/WHATS_NEW.md | sed '/^[[:space:]]*$/d' || true)"
          if [ -z "$notes" ]; then notes="- Внутренние улучшения и исправления"; fi
          printf '%s\n' "$notes" > notes.md
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "v2.0.${{ github.run_number }}" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "YAiPlayer 2.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
      - name: Post to Telegram channel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/v2.0.${{ github.run_number }}" > release.json
          pip install --quiet pillow || true
          python3 tools/brand/make_assets.py --card release-card.png release.json || true
          python3 telegram-release/post_release.py --release-json release.json --image release-card.png
      - name: Reset release notes for the next release
        continue-on-error: true
        run: |
          printf '%s\n' '<!-- Пункты для ЧЕЛОВЕКА (по-русски, "- Что нового"). Релиз берёт их как "что нового" и очищает файл. -->' > docs/WHATS_NEW.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/WHATS_NEW.md
          git diff --cached --quiet || {
            git commit -m "Release notes: reset after v2.0.${{ github.run_number }} [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          }
