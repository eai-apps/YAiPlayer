name: Tests
# Юнит-тесты ядра (Stalker и др.). Запуск: вручную (Actions → Tests → Run workflow)
# и при push в ветки test/** и helper-review. Отдельно от Build, чтобы не собирать зря APK.
on:
  workflow_dispatch:
  push:
    branches: ['test/**', helper-review]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  optimizer-unit:
    name: Mobile optimizer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты оптимизатора
        working-directory: clients/android-mobile
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest --tests 'tv.own.owntv.extras.tvoptimizer.TvOptimizerTest' -Powntv.corePath=${GITHUB_WORKSPACE}/clients/owntv-core --no-daemon --stacktrace
  core-unit:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Юнит-тесты ядра (Stalker, Subscription)
        working-directory: clients/owntv-core
        run: |
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest --tests 'tv.own.owntv.core.stalker.*' --tests 'tv.own.owntv.core.subscription.*' --tests 'tv.own.owntv.extras.remote.*' --tests 'tv.own.owntv.core.player.TrackTitleTest' --tests 'tv.own.owntv.core.content.SeasonRecordTitleTest' --tests 'tv.own.owntv.core.sync.RefreshQueueTest' --tests 'tv.own.owntv.core.content.SeasonListTest' --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: clients/owntv-core/core/build/reports/tests/
          if-no-files-found: ignore

  operator-migration:
    name: Room migration and provider search
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: clients/owntv-core
          script: |
            chmod +x gradlew
            ./gradlew :core:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tv.own.owntv.core.database.Migration53To54Test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-migration-report
          path: |
            clients/owntv-core/core/build/reports/androidTests/
            clients/owntv-core/core/build/outputs/androidTest-results/
            clients/owntv-core/core/schemas/tv.own.owntv.core.database.OwnTVDatabase/54.json
          if-no-files-found: ignore
