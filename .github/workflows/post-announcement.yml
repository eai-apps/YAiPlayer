name: Post announcement to Telegram
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Файл из docs/announcements"
        required: true
        default: "chat.html"
      rich:
        description: "Rich-версия из docs/announcements (пусто = обычный пост)"
        required: false
        default: ""
      image:
        description: "Картинка сверху (путь в репозитории, пусто = без картинки)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RICH: ${{ inputs.rich }}
          IMAGE: ${{ inputs.image }}
        run: |
          args=(--announce-file "docs/announcements/${{ inputs.file }}")
          [ -n "$RICH" ] && args+=(--rich-file "docs/announcements/$RICH")
          [ -n "$IMAGE" ] && args+=(--image "$IMAGE")
          python3 telegram-release/post_release.py "${args[@]}"
